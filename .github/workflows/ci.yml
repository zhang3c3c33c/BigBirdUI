name: Unit checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android/chat-ui/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -e ".[ios]"
      - name: Install root npm dependencies
        run: npm ci --ignore-scripts
      - name: Install chat UI dependencies
        run: npm --prefix android/chat-ui ci --ignore-scripts
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Root TypeScript
        run: npm run typecheck
      - name: Chat TypeScript
        run: npm --prefix android/chat-ui run typecheck
      - name: Node unit suites (no device or model credentials)
        shell: pwsh
        run: |
          $suites = @(
            'test:pi', 'test:desktop', 'test:session-title', 'test:task-state',
            'test:android-bridge', 'test:android-runtime-config',
            'test:screenshot-context', 'test:protocols', 'test:agent-tools',
            'test:phone-skill', 'test:calendar', 'test:nongui', 'test:android-chat'
          )
          foreach ($suite in $suites) {
            & npm run $suite
            if ($LASTEXITCODE -ne 0) { throw "$suite failed ($LASTEXITCODE)" }
          }
