[project]
name = "bbui-phone-tools"
version = "0.1.0"
description = "BigBirdUI phone assistant execution runtime for Android and iOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "zhang3c3c33c"}]
requires-python = ">=3.11"
dependencies = ["uiautomator2==3.7.0", "mcp==2.2.0", "av==18.1.0"]

[project.optional-dependencies]
ios = ["pymobiledevice3==9.34.0", "pmd-pytcp==0.0.6", "pytun-pmd3==3.0.3", "construct-typing==0.7.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bbui*"]

[project.urls]
Repository = "https://github.com/zhang3c3c33c/BigBirdUI"
Issues = "https://github.com/zhang3c3c33c/BigBirdUI/issues"
